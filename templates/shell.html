<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#37323E">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
{{robots}}
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{origin}}/assets/social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{canonical}}">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preload" as="font" type="font/woff2" href="{{dm_sans_font}}" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="{{manrope_font}}" crossorigin>
  <style>{{styles}}</style>
  <script src="/app.js?v={{app_version}}" defer></script>
{{analytics}}
  <script type="application/ld+json">{{schema}}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="/" aria-label="vj Vatsal Jain, home"><span class="monogram">vj<span aria-hidden="true">•</span></span><span>Vatsal Jain</span></a>
    <nav aria-label="Main navigation">
      <a href="/#work">Work</a><a href="/#about">About</a><a href="/#notes">Notes</a><a class="nav-contact" href="mailto:{{email}}">Let’s talk <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main">{{body}}</main>
  <footer class="wrap footer">
    <a class="wordmark" href="/">Vatsal Jain<span class="footer-dot">•</span></a>
    <span>Built around real work. Vancouver, BC.</span>
    <div><a href="{{linkedin}}">LinkedIn ↗</a><a href="{{youtube}}">YouTube ↗</a><a href="mailto:{{email}}">Email ↗</a></div>
  </footer>
</body>
</html>
